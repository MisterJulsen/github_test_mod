name: build
on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      - name: Build
        run: |
          chmod +x gradlew

          # Test-Build-Nummer setzen
          if [ "${{ github.event.pull_request.number }}" != "" ]; then
            export TEST_BUILD="pr.${{ github.event.pull_request.number }}"
          else
            export TEST_BUILD="run.${{ github.run_number }}"
          fi

          echo "Using TEST_BUILD=$TEST_BUILD"

          ./gradlew buildWithMetadata

      - name: Collect artifacts from metadata.json
        run: |
          echo "Artifacts in metadata.json:"
          jq -r '.artifacts[].filename' metadata.json

          FILES=""

          for BASE in $(jq -r '.artifacts[].filename' metadata.json); do
            echo "Processing artifact base name: $BASE"

            # Main JAR (BASE ist jetzt OHNE Extension)
            MAIN=$(find . -type f -name "${BASE}.jar" | head -n 1)
            if [ -z "$MAIN" ]; then
              echo "Missing main JAR for $BASE"
              exit 1
            fi

            FILES+="$MAIN"$'\n'
            DIR=$(dirname "$MAIN")

            # sources + javadoc (optional)
            for JAR in \
              "$DIR"/${BASE}*-sources.jar \
              "$DIR"/${BASE}*-javadoc.jar; do
              [ -e "$JAR" ] && FILES+="$JAR"$'\n'
            done
          done

          {
            echo "FILES<<EOF"
            printf '%s' "$FILES"
            echo "EOF"
          } >> "$GITHUB_ENV"



      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ env.FILES }}
