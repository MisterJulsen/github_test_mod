name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        java: [ 21 ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Loom Cache
        uses: actions/cache@v4
        with:
          path: "**/.gradle/loom-cache"
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle', 'settings.gradle', 'gradle.properties') }}
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build
      - name: Get Mod Version
        id: mod_version
        run: |
          VERSION=$(./gradlew -q printVersion)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read version from Gradle
        run: |
          VERSION="$(./gradlew -q printVersion | head -n 1 | tr -d '\r\n')"
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"


      - name: Download changelog script
        run: curl -o generate_changelog.sh https://files.mrjulsen.net/scripts/java/generate_changelog.sh

      - name: Make changelog script executable
        run: chmod +x generate_changelog.sh

      - name: Generate changelog
        run: ./generate_changelog.sh "${{ env.MOD_VERSION }}" > CHANGELOG.md

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.MOD_VERSION }}
          path: |
            fabric/build/libs/
            forge/build/libs/
            CHANGELOG.md

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MOD_VERSION }}
          name: ${{ env.MOD_VERSION }}
          draft: true
          prerelease: ${{ contains(env.MOD_VERSION, 'beta') || contains(env.MOD_VERSION, 'alpha') }}
          body_path: CHANGELOG.md
          files: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}