name: build
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      - name: Build
        run: |
          chmod +x gradlew
          TEST_BUILD=${{ github.event.pull_request.number || github.run_number }} ./gradlew build

      - name: Collect artifacts from metadata.json
        run: |
          set -e
          
          FILES=""
          
          echo "Reading metadata.json…"
          jq . metadata.json
          
          # Alle Artifact-Filenames aus metadata.json holen
          for MAIN in $(jq -r '.artifacts[].filename' metadata.json); do
            echo "Processing $MAIN"
          
            # Hauptdatei exakt finden
            MAIN_PATH=$(find . -type f -name "$MAIN" | head -n 1)
            if [ -z "$MAIN_PATH" ]; then
              echo "ERROR: Could not find artifact: $MAIN"
              exit 1
            fi
          
            DIR=$(dirname "$MAIN_PATH")
            BASE="${MAIN%.jar}"
          
            FILES+="$MAIN_PATH"$'\n'
          
            # sources + javadoc
            for SUFFIX in sources javadoc; do
              CANDIDATE="$DIR/$BASE-$SUFFIX.jar"
              if [ -e "$CANDIDATE" ]; then
                FILES+="$CANDIDATE"$'\n'
              fi
            done
          done
          
          echo "Collected files:"
          printf '%s\n' "$FILES"
          
          {
            echo "FILES<<EOF"
            printf '%s' "$FILES"
            echo "EOF"
          } >> "$GITHUB_ENV"


      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ env.FILES }}
