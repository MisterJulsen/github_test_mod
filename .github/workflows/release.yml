name: Release Build

on:
  push:
    tags:
      - 'release'

jobs:
  release:
    strategy:
      matrix:
        java: [ 21 ]
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout & Setup
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Loom Cache
        uses: actions/cache@v4
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/wrapper-validation-action@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---------------------------------------------------------
      # Read project metadata from gradle.properties
      # ---------------------------------------------------------
      - name: Read Gradle properties
        id: props
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          PLATFORMS=$(grep '^enabled_platforms=' gradle.properties | cut -d'=' -f2)
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------
      # Build Release
      # ---------------------------------------------------------
      - name: Build Release
        run: ./gradlew build

      # ---------------------------------------------------------
      # Changelog
      # ---------------------------------------------------------
      - name: Download changelog script
        run: curl -o generate_changelog.sh https://files.mrjulsen.net/scripts/java/generate_changelog.sh

      - name: Generate changelog
        run: ./generate_changelog.sh ${{ env.version }} > CHANGELOG.md

      # ---------------------------------------------------------
      # Upload Release Artifacts (CI artifacts)
      # ---------------------------------------------------------
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.version }}
          path: |
            fabric/build/libs/
            forge/build/libs/
            CHANGELOG.md

      # ---------------------------------------------------------
      # GitHub Release Draft
      # ---------------------------------------------------------
      - name: Create GitHub Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ env.version }}"
          body_path: CHANGELOG.md
          files: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
