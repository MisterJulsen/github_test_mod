name: Publish to Mod Platforms

on:
  release:
    types: [published]

jobs:
  prepare:
    if: ${{ !contains(github.event.release.body, '[skip-mod-publish]') }}
    runs-on: ubuntu-latest

    outputs:
      loaders: ${{ steps.parse.outputs.loaders }}
      release_title: ${{ steps.parse.outputs.release_title }}
      mod_version: ${{ steps.parse.outputs.mod_version }}
      mc_version: ${{ steps.parse.outputs.mc_version }}
      release_channel: ${{ steps.parse.outputs.release_channel }}
      full_version: ${{ steps.parse.outputs.full_version }}
      maven_group: ${{ steps.parse.outputs.maven_group }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: artifacts

      - name: Parse metadata and build loader matrix
        id: parse
        run: |
          META="artifacts/metadata.json"

          MOD_ID=$(jq -r '.mod_id' "$META")
          MOD_NAME=$(jq -r '.display_name' "$META")
          MC_VERSION=$(jq -r '.minecraft_version' "$META")
          MOD_VERSION=$(jq -r '.mod_version' "$META")
          FULL_VERSION=$(jq -r '.full_version' "$META")
          RELEASE_CHANNEL=$(jq -r '.release_channel' "$META")
          MAVEN_GROUP=$(jq -r '.maven_group' "$META")

          PLATFORM_STRING=$(jq -r '
            if (.artifacts | length) > 0 then
              "[" + (.artifacts | keys | map(ascii_upcase) | join("/")) + "]"
            else "[]" end
          ' "$META")

          TITLE=$(jq -r '.mod_release_title_format' .mod-build-config.json)
          TITLE=${TITLE//\{MOD_ID\}/$MOD_ID}
          TITLE=${TITLE//\{MOD_NAME\}/$MOD_NAME}
          TITLE=${TITLE//\{MOD_VERSION\}/$MOD_VERSION}
          TITLE=${TITLE//\{FULL_VERSION\}/$FULL_VERSION}
          TITLE=${TITLE//\{MC_VERSION\}/$MC_VERSION}
          TITLE=${TITLE//\{RELEASE_CHANNEL\}/$RELEASE_CHANNEL}
          TITLE=${TITLE//\{PLATFORMS\}/$PLATFORM_STRING}

          {
            echo "mod_id=$MOD_ID"
            echo "mod_name=$MOD_NAME"
            echo "mc_version=$MC_VERSION"
            echo "mod_version=$MOD_VERSION"
            echo "full_version=$FULL_VERSION"
            echo "release_channel=$RELEASE_CHANNEL"
            echo "maven_group=$MAVEN_GROUP"
            echo "platforms=$PLATFORM_STRING"
            echo "release_title=$TITLE"
          } >> "$GITHUB_OUTPUT"

          LOADERS_JSON=$(jq -c '[.artifacts[].platform] | unique' "$META")
          echo "loaders=$LOADERS_JSON" >> "$GITHUB_OUTPUT"

          jq -r '.artifacts | to_entries[] | "\(.key) \(.value.filename)"' "$META" \
            | while read -r loader filename; do
                {
                  echo "artifacts/${filename}.jar"
                  find artifacts/ -maxdepth 1 \
                    \( -name "*${loader}*sources.jar" -o -name "*${loader}*javadoc.jar" \) \
                    2>/dev/null || true
                } > "files_${loader}.txt"
                echo "=== files_${loader}.txt ==="
                cat "files_${loader}.txt"
              done

      - name: Upload loader file lists
        uses: actions/upload-artifact@v4
        with:
          name: loader-data
          path: files_*.txt
          retention-days: 1

      - name: Release summary
        run: |
          echo "================================================"
          echo "               RELEASE SUMMARY"
          echo "================================================"
          echo "Mod:          ${{ steps.parse.outputs.mod_id }}"
          echo "Minecraft:    ${{ steps.parse.outputs.mc_version }}"
          echo "Version:      ${{ steps.parse.outputs.mod_version }}"
          echo "Full:         ${{ steps.parse.outputs.full_version }}"
          echo "Channel:      ${{ steps.parse.outputs.release_channel }}"
          echo "Maven Group:  ${{ steps.parse.outputs.maven_group }}"
          echo "Loaders:      ${{ steps.parse.outputs.loaders }}"
          echo "================================================"

  # CurseForge & Modrinth – parallel per loader
  publish-platforms:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        loader: ${{ fromJson(needs.prepare.outputs.loaders) }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: artifacts

      - name: Download loader file lists
        uses: actions/download-artifact@v4
        with:
          name: loader-data

      - name: Load file list for ${{ matrix.loader }}
        id: files
        run: |
          FILE="files_${{ matrix.loader }}.txt"
          [ -f "$FILE" ] || { echo "Error: $FILE not found" >&2; exit 1; }
          {
            echo "list<<EOF"
            cat "$FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release title
        id: title
        run: |
          TITLE="${{ needs.prepare.outputs.release_title }}"
          TITLE=${TITLE//\{LOADER\}/${{ matrix.loader }}}
          echo "value=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.loader }} to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ steps.title.outputs.value }}
          version: ${{ needs.prepare.outputs.mod_version }}
          version-type: ${{ needs.prepare.outputs.release_channel }}
          game-versions: ${{ needs.prepare.outputs.mc_version }}
          loaders: ${{ matrix.loader }}
          changelog: ${{ github.event.release.body }}
          files: ${{ steps.files.outputs.list }}
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CF_ID }}
          curseforge-token: ${{ secrets.CF_TOKEN }}

  # Maven – einmaliger Push nach mod-resources, alle Loader in einem Commit
  publish-maven:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: artifacts

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MOD_RESOURCES_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" >> "$GITHUB_ENV"

      - name: Clone mod-resources
        run: git clone git@github.com:MisterJulsen/mod-resources.git /tmp/mod-resources

      - name: Publish all loaders to Maven
        env:
          META: artifacts/metadata.json
          MAVEN_ROOT: /tmp/mod-resources/maven
          FULL_VERSION: ${{ needs.prepare.outputs.full_version }}
          MAVEN_GROUP: ${{ needs.prepare.outputs.maven_group }}
        run: |
          # Convert group ID to path: de.mrjulsen → de/mrjulsen
          GROUP_PATH="${MAVEN_GROUP//.//}"
          MOD_ID=$(jq -r '.mod_id' "$META")

          jq -r '.artifacts | to_entries[] | "\(.key) \(.value.filename)"' "$META" \
            | while read -r loader filename; do
                JAR="artifacts/${filename}.jar"
                [ -f "$JAR" ] || { echo "Warning: $JAR not found, skipping" >&2; continue; }

                ARTIFACT_ID="${MOD_ID}-${loader}"
                DEPLOY_DIR="${MAVEN_ROOT}/${GROUP_PATH}/${ARTIFACT_ID}/${FULL_VERSION}"
                mkdir -p "$DEPLOY_DIR"

                # JAR
                DEST="${DEPLOY_DIR}/${ARTIFACT_ID}-${FULL_VERSION}.jar"
                cp "$JAR" "$DEST"
                md5sum  "$DEST" | awk '{print $1}' > "${DEST}.md5"
                sha1sum "$DEST" | awk '{print $1}' > "${DEST}.sha1"

                # sources.jar (optional)
                SOURCES=$(find artifacts/ -maxdepth 1 -name "*${loader}*sources.jar" | head -n1 || true)
                if [ -n "$SOURCES" ]; then
                  DEST_SRC="${DEPLOY_DIR}/${ARTIFACT_ID}-${FULL_VERSION}-sources.jar"
                  cp "$SOURCES" "$DEST_SRC"
                  md5sum  "$DEST_SRC" | awk '{print $1}' > "${DEST_SRC}.md5"
                  sha1sum "$DEST_SRC" | awk '{print $1}' > "${DEST_SRC}.sha1"
                fi

                # POM
                POM="${DEPLOY_DIR}/${ARTIFACT_ID}-${FULL_VERSION}.pom"
                cat > "$POM" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                                       http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>${MAVEN_GROUP}</groupId>
            <artifactId>${ARTIFACT_ID}</artifactId>
            <version>${FULL_VERSION}</version>
            <packaging>jar</packaging>
          </project>
          EOF
                md5sum  "$POM" | awk '{print $1}' > "${POM}.md5"
                sha1sum "$POM" | awk '{print $1}' > "${POM}.sha1"

                # maven-metadata.xml
                META_DIR="${MAVEN_ROOT}/${GROUP_PATH}/${ARTIFACT_ID}"
                META_FILE="${META_DIR}/maven-metadata.xml"

                if [ -f "$META_FILE" ]; then
                  mapfile -t VERSIONS < <(grep -oP '(?<=<version>)[^<]+' "$META_FILE" || true)
                else
                  VERSIONS=()
                fi

                if [[ ! " ${VERSIONS[*]:-} " =~ " ${FULL_VERSION} " ]]; then
                  VERSIONS+=("$FULL_VERSION")
                fi

                LATEST="${VERSIONS[-1]}"
                UPDATED=$(date -u +"%Y%m%d%H%M%S")
                {
                  echo '<?xml version="1.0" encoding="UTF-8"?>'
                  echo '<metadata>'
                  echo "  <groupId>${MAVEN_GROUP}</groupId>"
                  echo "  <artifactId>${ARTIFACT_ID}</artifactId>"
                  echo "  <versioning>"
                  echo "    <latest>${LATEST}</latest>"
                  echo "    <release>${LATEST}</release>"
                  echo "    <versions>"
                  for v in "${VERSIONS[@]}"; do echo "      <version>${v}</version>"; done
                  echo "    </versions>"
                  echo "    <lastUpdated>${UPDATED}</lastUpdated>"
                  echo "  </versioning>"
                  echo '</metadata>'
                } > "$META_FILE"
                md5sum  "$META_FILE" | awk '{print $1}' > "${META_FILE}.md5"
                sha1sum "$META_FILE" | awk '{print $1}' > "${META_FILE}.sha1"

                echo "Prepared: ${MAVEN_GROUP}:${ARTIFACT_ID}:${FULL_VERSION}"
              done

      - name: Commit and push to mod-resources
        run: |
          cd /tmp/mod-resources
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add maven/
          if git diff --cached --quiet; then
            echo "Nothing to commit – version already published"
          else
            git commit -m "maven: ${{ needs.prepare.outputs.full_version }}"
            git push origin HEAD
          fi