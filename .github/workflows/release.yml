name: Create Release

on:
  workflow_dispatch:
    inputs:
      trigger_mod_publish:
        description: "Publish to CurseForge/Modrinth after approval"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Read metadata
        id: meta
        run: |
          get() { jq -r "$1" metadata.json; }

          MOD_ID=$(get '.mod_id')
          MOD_NAME=$(get '.display_name')
          MC_VERSION=$(get '.minecraft_version')
          MOD_VERSION=$(get '.mod_version')
          FULL_VERSION=$(get '.full_version')
          RELEASE_CHANNEL=$(get '.release_channel')

          PLATFORM_STRING=$(jq -r '
            if (.artifacts | length) > 0 then
              "[" + (.artifacts | keys | map(ascii_upcase) | join("/")) + "]"
            else "[]" end
          ' metadata.json)

          TITLE=$(jq -r '.github_release_title_format' .mod-build-config.json)
          TITLE=${TITLE//\{MOD_ID\}/$MOD_ID}
          TITLE=${TITLE//\{MOD_NAME\}/$MOD_NAME}
          TITLE=${TITLE//\{MOD_VERSION\}/$MOD_VERSION}
          TITLE=${TITLE//\{FULL_VERSION\}/$FULL_VERSION}
          TITLE=${TITLE//\{MC_VERSION\}/$MC_VERSION}
          TITLE=${TITLE//\{RELEASE_CHANNEL\}/$RELEASE_CHANNEL}
          TITLE=${TITLE//\{PLATFORMS\}/$PLATFORM_STRING}

          {
            echo "mod_id=$MOD_ID"
            echo "mod_name=$MOD_NAME"
            echo "mc_version=$MC_VERSION"
            echo "mod_version=$MOD_VERSION"
            echo "full_version=$FULL_VERSION"
            echo "release_channel=$RELEASE_CHANNEL"
            echo "platforms=$PLATFORM_STRING"
            echo "release_title=$TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Download changelog script
        env:
          SCRIPT_COMMIT: ${{ vars.CHANGELOG_SCRIPT_COMMIT }}
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/MisterJulsen/mod-resources/main/data/build-tools/generate_changelog.sh" \
            -o generate_changelog.sh
          chmod +x generate_changelog.sh

      - name: Generate changelog
        run: ./generate_changelog.sh "${{ steps.meta.outputs.full_version }}" "${{ steps.meta.outputs.mod_name }}"

      - name: Collect release files
        id: collect
        run: |
          {
            echo "files<<EOF"
            for STEM in $(jq -r '.artifacts[].filename' metadata.json); do
              MAIN=$(find . -type f -name "${STEM}.jar" ! -path "*/.gradle/*" | head -n1)
              if [ -z "$MAIN" ]; then
                echo "ERROR: Artifact not found: ${STEM}.jar" >&2
                exit 1
              fi
              echo "$MAIN"
              DIR=$(dirname "$MAIN")
              find "$DIR" -maxdepth 1 \
                \( -name "*sources.jar" -o -name "*javadoc.jar" \) \
                2>/dev/null || true
            done
            echo "metadata.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load changelog
        id: changelog
        run: |
          {
            echo "content<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.full_version }}
          path: |
            ${{ steps.collect.outputs.files }}
            CHANGELOG.md
          retention-days: 30

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.full_version }}
          name: ${{ steps.meta.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.meta.outputs.release_channel != 'release' }}
          body: |
            ${{ inputs.trigger_mod_publish == false && '[skip-mod-publish]' || '' }}
            ${{ steps.changelog.outputs.content }}
          files: ${{ steps.collect.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}