name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ------------------------------------------------------------
      # Java & Gradle Setup
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        run: ./gradlew build

      # ------------------------------------------------------------
      # Read mod version
      # ------------------------------------------------------------
      - name: Write and read version
        run: |
          ./gradlew -q exportMinecraftVersion
          VERSION="$(tr -d '\r\n' < build/minecraft_version_exp.txt)"
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Changelog generation
      # ------------------------------------------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download changelog script
        run: |
          curl -fsSL \
            https://files.mrjulsen.net/scripts/java/generate_changelog.sh \
            -o generate_changelog.sh

      - name: Make changelog script executable
        run: chmod +x generate_changelog.sh

      - name: Generate changelog
        run: |
          ./generate_changelog.sh "${{ env.MOD_VERSION }}" > CHANGELOG.md
          echo "Generated changelog:"
          cat CHANGELOG.md

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.MOD_VERSION }}
          path: |
            fabric/build/libs/
            forge/build/libs/
            CHANGELOG.md

      # ------------------------------------------------------------
      # GitHub Release (Draft)
      # ------------------------------------------------------------
      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MOD_VERSION }}
          name: ${{ env.MOD_VERSION }}
          draft: true
          prerelease: ${{ contains(env.MOD_VERSION, 'beta') || contains(env.MOD_VERSION, 'alpha') }}
          body_path: CHANGELOG.md
          files: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
