name: Cleanup Auto-Port Branches

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest

    if: |
      contains(github.event.pull_request.labels.*.name, 'auto-port') &&
      startsWith(github.event.pull_request.head.ref, 'auto-port/')

    steps:
      - name: Delete auto-port branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Deleting auto-port branch: $BRANCH"

          gh api \
            --method DELETE \
            "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
