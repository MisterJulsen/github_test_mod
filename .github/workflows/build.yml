# .github/workflows/build.yml
#
# Triggert bei Push auf jeden Branch der mit "mc/" beginnt
# (z.B. mc/1.20, mc/1.21) sowie bei manuellem Start.
# Baut alle Loader via Architectury, generiert den Changelog
# und erstellt einen GitHub Draft-Release.
#
# Secrets die du setzen musst (Settings → Secrets → Actions):
#   - MAVEN_DEPLOY_KEY : SSH-Key mit Write-Zugriff auf dein maven-Pages-Repo
#     (wird hier noch nicht gebraucht, aber schon mal der Vollständigkeit halber)

name: Build & Draft Release

on:
  push:
    branches:
      - "mc/**"       # mc/1.20, mc/1.21, ...
      - "main"
    tags-ignore:
      - "**"          # Tag-Pushes überspringen (werden von publish.yml behandelt)
  workflow_dispatch:  # Manueller Start über GitHub UI

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Nötig für Draft-Release erstellen

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Vollständige History für git describe / Changelog

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ── Gradle Cache ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Version & Mod-Name aus gradle.properties lesen ───────────────────
      # Passe die Property-Namen an deine gradle.properties an.
      - name: Read version & mod name
        id: meta
        run: |
          VERSION=$(grep -m1 "^mod_version" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MOD_NAME=$(grep -m1 "^mod_name" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MC_VERSION=$(grep -m1 "^minecraft_version" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "mod_name=$MOD_NAME"     >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          # Tag-Name: z.B. v1.2.0-mc1.21
          echo "tag=v${VERSION}-mc${MC_VERSION}" >> "$GITHUB_OUTPUT"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build all loaders
        run: ./gradlew build --no-daemon
        # Architectury baut Fabric, Forge und NeoForge in einem Durchgang.
        # Die JARs landen standardmäßig in:
        #   fabric/build/libs/
        #   forge/build/libs/
        #   neoforge/build/libs/

      # ── JARs sammeln ──────────────────────────────────────────────────────
      # Nur die "echten" JARs, keine -dev, -sources, -all Varianten.
      - name: Collect JARs
        run: |
          mkdir -p release-jars
          find . -path "*/build/libs/*.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-all.jar" \
            ! -name "*-dev-shadow.jar" \
            -exec cp {} release-jars/ \;
          echo "=== JARs collected ==="
          ls -la release-jars/

      # ── Changelog generieren ──────────────────────────────────────────────
      - name: Generate Changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          bash scripts/generate-changelog.sh \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.mod_name }}"

      # ── Draft Release erstellen ───────────────────────────────────────────
      # Der Release-Editor auf GitHub hat einen vollständigen Markdown-Editor.
      # Du kannst dort den Changelog bearbeiten und die JARs herunterladen.
      # Erst wenn du "Publish release" klickst, startet publish.yml.
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.mod_name }} v${{ steps.meta.outputs.version }} (MC ${{ steps.meta.outputs.mc_version }})"
          body_path: CHANGELOG.md
          draft: true          # ← Bleibt Draft bis du "Publish" klickst
          prerelease: false
          files: release-jars/*.jar
          fail_on_unmatched_files: true