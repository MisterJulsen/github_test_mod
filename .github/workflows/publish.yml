# .github/workflows/publish.yml
#
# Triggert AUSSCHLIESSLICH wenn du einen Draft-Release auf GitHub
# auf "Publish release" klickst. Kein manueller Trigger nötig.
#
# Secrets die du setzen musst (Settings → Secrets → Actions):
#   - CURSEFORGE_API_KEY   : CurseForge API Token
#   - MODRINTH_API_KEY     : Modrinth API Token (aus modrinth.com/settings/pats)
#   - MAVEN_DEPLOY_KEY     : SSH Private Key mit Write-Zugriff auf dein maven-Pages-Repo
#
# Variables (Settings → Variables → Actions):
#   - CURSEFORGE_PROJECT_ID : Numerische ID deines CurseForge-Projekts
#   - MODRINTH_PROJECT_ID   : Slug oder ID deines Modrinth-Projekts
#   - MAVEN_REPO            : GitHub-Repo für dein Maven (z.B. "deinuser/maven")

name: Publish Release

on:
  release:
    types: [published]   # Feuert wenn du "Publish release" klickst

jobs:
  publish:
    name: Publish to CurseForge, Modrinth & Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ── Gradle Cache ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Metadaten aus gradle.properties ───────────────────────────────────
      - name: Read metadata
        id: meta
        run: |
          VERSION=$(grep -m1 "^mod_version"       gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MOD_NAME=$(grep -m1 "^mod_name"          gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MC_VERSION=$(grep -m1 "^minecraft_version" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          GROUP=$(grep -m1 "^maven_group"          gradle.properties | cut -d'=' -f2 | tr -d ' ')
          ARTIFACT=$(grep -m1 "^archives_base_name" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "mod_name=$MOD_NAME"     >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "group=$GROUP"           >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT"     >> "$GITHUB_OUTPUT"

      # ── Changelog aus Release-Body holen ──────────────────────────────────
      # Der Release-Body enthält deinen (ggf. bearbeiteten) Changelog.
      - name: Extract changelog from release
        id: changelog
        run: |
          # Schreibe den Release-Body in eine Datei für Upload-Actions
          echo "${{ github.event.release.body }}" > CHANGELOG_RELEASE.md
          echo "Changelog:"
          cat CHANGELOG_RELEASE.md

      # ── Neu bauen (auf dem getaggten Commit) ──────────────────────────────
      # Wichtig: Wir bauen neu auf dem exakten Release-Commit, nicht auf
      # den Artifacts vom Build-Job (die könnten veraltet sein wenn du den
      # Changelog editiert hast und Zeit vergangen ist).
      - name: Build all loaders
        run: ./gradlew build --no-daemon

      # ── JARs sammeln ──────────────────────────────────────────────────────
      - name: Collect JARs
        run: |
          mkdir -p release-jars
          find . -path "*/build/libs/*.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-all.jar" \
            ! -name "*-dev-shadow.jar" \
            -exec cp {} release-jars/ \;
          echo "=== Publishing JARs ==="
          ls -la release-jars/

      # ── CurseForge Upload ─────────────────────────────────────────────────
      # Docs: https://github.com/marketplace/actions/curseforge-upload
      # Passe "game_versions" und "loaders" an deine tatsächlichen Werte an.
      - name: Upload to CurseForge (Fabric)
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_KEY }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          upload_file: release-jars/*-fabric.jar
          display_name: "${{ steps.meta.outputs.mod_name }} v${{ steps.meta.outputs.version }} [Fabric] [MC ${{ steps.meta.outputs.mc_version }}]"
          changelog: ${{ github.event.release.body }}
          changelog_type: markdown
          game_versions: "${{ steps.meta.outputs.mc_version }}"
          release_type: release
          loaders: fabric

      - name: Upload to CurseForge (Forge)
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_KEY }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          upload_file: release-jars/*-forge.jar
          display_name: "${{ steps.meta.outputs.mod_name }} v${{ steps.meta.outputs.version }} [Forge] [MC ${{ steps.meta.outputs.mc_version }}]"
          changelog: ${{ github.event.release.body }}
          changelog_type: markdown
          game_versions: "${{ steps.meta.outputs.mc_version }}"
          release_type: release
          loaders: forge

      - name: Upload to CurseForge (NeoForge)
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_KEY }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          upload_file: release-jars/*-neoforge.jar
          display_name: "${{ steps.meta.outputs.mod_name }} v${{ steps.meta.outputs.version }} [NeoForge] [MC ${{ steps.meta.outputs.mc_version }}]"
          changelog: ${{ github.event.release.body }}
          changelog_type: markdown
          game_versions: "${{ steps.meta.outputs.mc_version }}"
          release_type: release
          loaders: neoforge

      # ── Modrinth Upload ───────────────────────────────────────────────────
      # Docs: https://github.com/marketplace/actions/modrinth-publish
      - name: Upload to Modrinth (Fabric)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
          files: release-jars/*-fabric.jar
          name: "${{ steps.meta.outputs.mod_name }} v${{ steps.meta.outputs.version }} [Fabric]"
          version: ${{ steps.meta.outputs.version }}-fabric
          version-type: release
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.mc_version }}

      - name: Upload to Modrinth (Forge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
          files: release-jars/*-forge.jar
          name: "${{ steps.meta.outputs.mod_name }} v${{ steps.meta.outputs.version }} [Forge]"
          version: ${{ steps.meta.outputs.version }}-forge
          version-type: release
          changelog: ${{ github.event.release.body }}
          loaders: forge
          game-versions: ${{ steps.meta.outputs.mc_version }}

      - name: Upload to Modrinth (NeoForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_API_KEY }}
          files: release-jars/*-neoforge.jar
          name: "${{ steps.meta.outputs.mod_name }} v${{ steps.meta.outputs.version }} [NeoForge]"
          version: ${{ steps.meta.outputs.version }}-neoforge
          version-type: release
          changelog: ${{ github.event.release.body }}
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.mc_version }}

      # ── Maven auf GitHub Pages publishen ──────────────────────────────────
      # Baut das Maven-Layout und pushed es in dein separates maven-Repo.
      - name: Publish to Maven (GitHub Pages)
        env:
          MAVEN_DEPLOY_KEY: ${{ secrets.MAVEN_DEPLOY_KEY }}
          MAVEN_REPO: ${{ vars.MAVEN_REPO }}   # z.B. "deinuser/maven"
          GROUP: ${{ steps.meta.outputs.group }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
          VERSION: ${{ steps.meta.outputs.version }}
          MC_VERSION: ${{ steps.meta.outputs.mc_version }}
        run: bash scripts/publish-maven.sh