name: Publish to Mod Platforms

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout (nur für Scripts, nicht für Metadaten!)
      # ------------------------------------------------------------

      - name: Checkout correct branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # ------------------------------------------------------------
      # Release Assets laden
      # ------------------------------------------------------------

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: artifacts

      # ------------------------------------------------------------
      # Metadata einlesen
      # ------------------------------------------------------------

      - name: Parse metadata.json
        run: |
          META_FILE="artifacts/metadata.json"

          VERSION=$(jq -r '.version' "$META_FILE")
          MC_VERSION=$(jq -r '.minecraft_version' "$META_FILE")
          RELEASE_TYPE=$(jq -r '.release_channel' "$META_FILE")

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TYPE=$RELEASE_TYPE" >> $GITHUB_ENV

          echo "ARTIFACT_FILES<<EOF" >> $GITHUB_ENV
          jq -r '.artifacts[].filename' "$META_FILE" | sed 's|^|artifacts/|' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "LOADERS<<EOF" >> $GITHUB_ENV
          jq -r '.artifacts[].platform' "$META_FILE" | sort -u >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV


      # ------------------------------------------------------------
      # Release-Zusammenfassung
      # ------------------------------------------------------------

      - name: Print release summary
        run: |
          echo "======================================="
          echo "           RELEASE SUMMARY"
          echo "======================================="
          echo ""
          echo "Version:          $VERSION"
          echo "Minecraft:        $MC_VERSION"
          echo "Release Type:     $RELEASE_TYPE"
          echo "Loaders:          $LOADERS"
          echo ""
          echo "Changelog:"
          echo "---------------------------------------"
          echo "${{ github.event.release.body }}"
          echo "---------------------------------------"
          echo ""
          echo "Artifacts:"
          echo "---------------------------------------"
          for f in $ARTIFACT_FILES; do
            echo "$f"
          done
          echo "---------------------------------------"
          echo ""
          echo "Ready to publish to Modrinth & CurseForge"
          echo "======================================="

      # ------------------------------------------------------------
      # Publish
      # ------------------------------------------------------------

      - name: Publish to Mod Platforms
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ env.VERSION }}
          changelog: ${{ github.event.release.body }}
          files: ${{ env.ARTIFACT_FILES }}

          game-versions: ${{ env.MC_VERSION }}
          version-type: ${{ env.RELEASE_TYPE }}
          loaders: ${{ env.LOADERS }}

          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ secrets.CF_ID }}
          curseforge-token: ${{ secrets.CF_TOKEN }}
