plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id "net.mrjulsen.mod-build-tools" version "2.0.1"  // bump nach Plugin-Update
}

architectury {
    minecraft = project.minecraft_version
}

// ENTFERNT: allprojects { version = ... }
// Das Plugin setzt project.version auf allen (Sub-)Projekten in afterEvaluate.
// Ein eigenes version-Assignment hier würde je nach Evaluierungs-Reihenfolge
// das Plugin überschreiben oder umgekehrt – deshalb genau eine Stelle.

allprojects {
    group = rootProject.maven_group
    // version wird vom modBuildTools-Plugin gesetzt
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    loom {
        silentMojangMappingsLicense()
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
        maven {
            url = uri("https://maven.pkg.github.com/copycats-plus/copycats")
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        withJavadocJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}