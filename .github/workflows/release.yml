name: Release Build

on:
  push:
    tags:
      - 'release'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate final version
        run: |
          echo "Final version: ${{ env.version }}"

      - name: Build Release
        run: ./gradlew build

      - name: Generate Changelog
        run: |
          chmod +x scripts/generate_changelog.sh
          scripts/generate_changelog.sh ${{ env.version }} > CHANGELOG.md

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.version }}
          path: |
            fabric/build/libs/
            forge/build/libs/
            CHANGELOG.md
