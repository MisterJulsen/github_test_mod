name: Auto Port

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      items:
        description: "Pull Request or Commit SHAs (comma separated)"
        required: true
      target_branches:
        description: "Target branches (comma separated, empty = config)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-port:
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'auto-port')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read config
        id: config
        run: |
          PATTERN=$(jq -r '.main_branch_pattern' .mod-build-config.json)
          BRANCHES=$(jq -r '.auto_port_branches[]' .mod-build-config.json | tr '\n' ' ')
          echo "pattern=$PATTERN" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

      - name: Check base branch pattern
        if: github.event_name == 'pull_request'
        id: branchcheck
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          if [[ "$BASE" =~ ${{ steps.config.outputs.pattern }} ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if branch does not match pattern
        if: |
          github.event_name == 'pull_request' &&
          steps.branchcheck.outputs.valid != 'true'
        run: exit 0

      - name: Determine items to port
        id: items
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            COMMITS=$(gh pr view $PR --json commits -q '.commits[].oid')
          else
            COMMITS=""
            ITEMS=$(echo "${{ inputs.items }}" | tr ',' ' ')
            for ITEM in $ITEMS; do
              if [[ "$ITEM" =~ ^[0-9]+$ ]]; then
                COMMITS+=" $(gh pr view $ITEM --json commits -q '.commits[].oid')"
              else
                COMMITS+=" $ITEM"
              fi
            done
          fi

          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

      - name: Determine target branches
        id: targets
        run: |
          if [ -n "${{ inputs.target_branches }}" ]; then
            TARGETS=$(echo "${{ inputs.target_branches }}" | tr ',' ' ')
          else
            TARGETS="${{ steps.config.outputs.branches }}"
          fi
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT

      - name: Create auto-port PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.base.ref || 'manual' }}"

          for TARGET in ${{ steps.targets.outputs.targets }}; do
            BACKPORT_BRANCH="auto-port/$(date +%s)-to-$TARGET"

            git checkout -b "$BACKPORT_BRANCH" "origin/$TARGET" || continue

            for COMMIT in ${{ steps.items.outputs.commits }}; do
              git cherry-pick "$COMMIT" || {
                git cherry-pick --abort
                exit 1
              }
            done

            git push origin "$BACKPORT_BRANCH"

            gh pr create \
              --base "$TARGET" \
              --head "$BACKPORT_BRANCH" \
              --title "[Auto-Port] → $TARGET" \
              --body "Automatic Port from $SOURCE_BRANCH" \
              --label auto-port
          done
