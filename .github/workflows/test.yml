name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-draft:
    strategy:
      matrix:
        java: [ 21 ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/wrapper-validation-action@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download changelog script
        run: curl -o generate_changelog.sh https://files.mrjulsen.net/scripts/java/generate_changelog.sh

      - name: Generate changelog
        run: |
          chmod +x generate_changelog.sh
          ./generate_changelog.sh "${{ github.event.inputs.version }}" > CHANGELOG.md

      - name: Build Mods
        # Hinweis: Hier nur 'build', noch kein 'publishMods'
        run: ./gradlew -Pmod_version=${{ github.event.inputs.version }} build

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body_path: CHANGELOG.md
          draft: true  # <--- Das ist das Wichtigste!
          files: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}