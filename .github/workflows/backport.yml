name: Backport PRs

on:
  pull_request:
    types: [closed]
    branches:
      - 'mc/*'

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read backport config (JSON)
        id: cfg
        run: |
          TARGETS=$(jq -r '.branches[]' .github/backport-config.json | tr '\n' ' ')
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT

      - name: Determine source branch
        id: src
        run: |
          echo "src=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Create backport PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for target in ${{ steps.cfg.outputs.targets }}; do
            if [ "$target" = "${{ steps.src.outputs.src }}" ]; then
              echo "Skipping same branch: $target"
              continue
            fi

            echo "Backporting to $target"

            git fetch origin $target
            git checkout $target
            git pull origin $target

            branch="backport/${{ github.event.pull_request.number }}-to-${target##*/}"
            git checkout -b "$branch"

            # Try cherry-pick
            if ! git cherry-pick -x ${{ github.event.pull_request.merge_commit_sha }}; then
              echo "Cherry-pick conflict in $target"
              git add .
              git commit -m "Backport (with conflicts) of #${{ github.event.pull_request.number }}"
            fi

            git push origin "$branch"

            gh pr create \
              --title "Backport #${{ github.event.pull_request.number }} to ${target}" \
              --body "Automated backport of #${{ github.event.pull_request.number }} into ${target}." \
              --base "$target" \
              --head "$branch"
          done
