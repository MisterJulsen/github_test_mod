name: Publish to Mod Platforms

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout correct branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Read Gradle properties
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          RELEASE_CHANNEL=$(grep '^release_channel=' gradle.properties | cut -d'=' -f2)
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "RELEASE_CHANNEL=$RELEASE_CHANNEL" >> $GITHUB_ENV

      - name: Determine release type
        run: |
          TYPE=$(scripts/map_release_channel.sh "${{ env.RELEASE_CHANNEL }}")
          echo "RELEASE_TYPE=$TYPE" >> $GITHUB_ENV

      - name: Read modules
        run: |
          MODULES=$(jq -r '.modules[]' .release-config.json)
          echo "MODULES=$MODULES" >> $GITHUB_ENV

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*"
          out-file-path: "artifacts"

      - name: Collect release jars from Gradle metadata
        run: |
          FILES=$(scripts/collect_release_jars.sh "${{ env.MODULES }}")
          echo "ARTIFACT_FILES=$FILES" >> $GITHUB_ENV
      - name: Print release summary
        run: |
          echo "======================================="
          echo "           RELEASE SUMMARY"
          echo "======================================="
          echo ""
          echo "Version:          ${{ github.event.release.tag_name }}"
          echo "Minecraft:        ${{ env.MC_VERSION }}"
          echo "Release Type:     ${{ env.RELEASE_TYPE }}"
          echo "Platforms:        ${{ env.MODULES }}"
          echo ""
          echo "Changelog:"
          echo "---------------------------------------"
          echo "${{ github.event.release.body }}"
          echo "---------------------------------------"
          echo ""
          echo "Artifacts:"
          echo "---------------------------------------"
          for f in ${{ env.ARTIFACT_FILES }}; do
            echo "$f"
          done
          echo "---------------------------------------"
          echo ""
          echo "Ready to publish to Modrinth & CurseForge"
          echo "======================================="

      - name: Publish to Mod Platforms
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          files: ${{ env.ARTIFACT_FILES }}

          game-versions: ${{ env.MC_VERSION }}
          version-type: ${{ env.RELEASE_TYPE }}
          loaders: ${{ env.MODULES }}

          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ secrets.CF_ID }}
          curseforge-token: ${{ secrets.CF_TOKEN }}
