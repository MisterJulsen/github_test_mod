ext {
    mc = project.minecraft_version
    mod = project.mod_version
    channel = project.release_channel

    // Release channel "release" → kein Channel im Namen
    baseVersion = channel == "release"
            ? "${mc}-${mod}"
            : "${mc}-${channel}-${mod}"

    // Snapshot-Versionen bekommen Build-Nummer
    if (System.getenv("SNAPSHOT_BUILD") != null) {
        versionString = "${baseVersion}-SNAPSHOT+build.${System.getenv("SNAPSHOT_BUILD")}"
    }
    // Test-Versionen (PR-Builds)
    else if (System.getenv("TEST_BUILD") != null) {
        versionString = "${baseVersion}-TEST+pr.${System.getenv("TEST_BUILD")}"
    }
    // Release
    else {
        versionString = baseVersion
    }
}

version = versionString
