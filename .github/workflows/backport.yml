name: Backport PRs

on:
  pull_request:
    types: [closed]
    branches:
      - 'mc/*'

jobs:
  backport:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read backport config (JSON)
        id: cfg
        run: |
          TARGETS=$(jq -r '.branches[]' .github/backport-config.json | tr '\n' ' ')
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT

      - name: Determine source branch
        id: src
        run: |
          echo "src=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Download backport script
        run: curl -o backport.sh https://files.mrjulsen.net/scripts/java/minecraft_version_backport.sh

      - name: Make script executable
        run: chmod +x backport.sh

      - name: Run backport script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./backport.sh \
            "${{ steps.cfg.outputs.targets }}" \
            "${{ steps.src.outputs.src }}" \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.merge_commit_sha }}"