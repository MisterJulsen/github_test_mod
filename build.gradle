plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
    id "net.mrjulsen.mod-build-tools" version "1.0.0"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {

    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    loom {
        silentMojangMappingsLicense()
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }
}


modBuildTools {
    publish {
        localRepoDir = "${System.getProperty('user.home')}/.m2/github/modsrepo/maven"
        s3Bucket = "maven"
        endpointEnv = System.getenv("MAVEN_ENDPOINT")
        accessKeyEnv = System.getenv("MAVEN_ACCESS_KEY")
        secretKeyEnv = System.getenv("MAVEN_SECRET_KEY")
        publishCommon = false
    }
    javadoc {
        title = "Test Mod API ${release_channel}-${mod_version}"
        tags = [
            "apiNote:a:API Note:",
            "implNote:a:Impl Note:",
            "implSpec:a:Impl Spec:",
            "related:a:Related:",
            "example:a:Examples:",
            "side:a:Valid on side:"
        ]
    }
}

