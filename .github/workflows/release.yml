name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ------------------------------------------------------------
      # Java & Gradle
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle & Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          gradle-version: wrapper

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        env:
          MAVEN_ENDPOINT: ${{ secrets.MAVEN_ENDPOINT }}
          MAVEN_ACCESS_KEY: ${{ secrets.MAVEN_ACCESS_KEY }}
          MAVEN_SECRET_KEY: ${{ secrets.MAVEN_SECRET_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew publishS3

      # ------------------------------------------------------------
      # Read metadata.json into env
      # ------------------------------------------------------------
      - name: Read metadata
        run: |          
          VERSION=$(jq -r '.version' metadata.json)
          MC_VERSION=$(jq -r '.minecraft_version' metadata.json)
          RELEASE_CHANNEL=$(jq -r '.release_channel' metadata.json)

          echo "MOD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "RELEASE_CHANNEL=$RELEASE_CHANNEL" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Generate Changelog
      # ------------------------------------------------------------
      - name: Generate changelog
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          curl -fsSL \
            https://files.mrjulsen.net/scripts/java/generate_changelog.sh \
            -o generate_changelog.sh

          chmod +x generate_changelog.sh
          ./generate_changelog.sh "${{ env.MOD_VERSION }}"

      - name: Upload Release Artifacts (filtered)
        run: |
          echo "Reading metadata.json..."
          cat metadata.json

          mkdir filtered_artifacts

          # Extract filenames from metadata.json
          for file in $(jq -r '.artifacts[].filename' metadata.json); do
            echo "Selecting $file"
            find . -type f -name "$file" -exec cp {} filtered_artifacts/ \;
          done

          # Optional: include sources + javadoc if they exist
          for file in $(jq -r '.artifacts[].filename' metadata.json); do
            base="${file%.jar}"

            for suffix in "-sources.jar" "-javadoc.jar"; do
              match=$(find . -type f -name "${base}${suffix}")
              if [ -n "$match" ]; then
                echo "Including $match"
                cp "$match" filtered_artifacts/
              fi
            done
          done

        shell: bash

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.MOD_VERSION }}
          path: |            
            filtered_artifacts/*
            metadata.json
            CHANGELOG.md


      # ------------------------------------------------------------
      # Upload Artifacts
      # ------------------------------------------------------------
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.MOD_VERSION }}
          path: |
            filtered_artifacts/*
            metadata.json
            CHANGELOG.md

      # ------------------------------------------------------------
      # GitHub Release (Draft)
      # ------------------------------------------------------------
      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MOD_VERSION }}
          name: ${{ env.MOD_VERSION }}
          target_commitish: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ env.RELEASE_CHANNEL != 'release' }}
          body_path: CHANGELOG.md
          files: |
            ${{ env.FILES }}
            metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
