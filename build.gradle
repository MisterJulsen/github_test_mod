plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
    id "net.mrjulsen.mod-build-tools" version "1.0.11"  // bump nach Plugin-Update
}

architectury {
    minecraft = project.minecraft_version
}

// ENTFERNT: allprojects { version = ... }
// Das Plugin setzt project.version auf allen (Sub-)Projekten in afterEvaluate.
// Ein eigenes version-Assignment hier würde je nach Evaluierungs-Reihenfolge
// das Plugin überschreiben oder umgekehrt – deshalb genau eine Stelle.

allprojects {
    group = rootProject.maven_group
    // version wird vom modBuildTools-Plugin gesetzt
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    loom {
        silentMojangMappingsLicense()
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
        maven {
            url = uri("https://maven.pkg.github.com/copycats-plus/copycats")
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        withJavadocJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

modBuildTools {
    modId = project.mod_id               // aus gradle.properties
    displayName = project.display_name   // aus gradle.properties

    publish {
        localRepoDir = "${System.getProperty('user.home')}/.m2/github/modsrepo/maven"
        publishCommon = false
        mavenGroup = project.maven_group  // aus gradle.properties
    }

    javadoc {
        title = "${project.display_name} API ${project.release_channel}-${project.mod_version}"
        tags = [
                "apiNote:a:API Note:",
                "implNote:a:Impl Note:",
                "implSpec:a:Impl Spec:",
                "related:a:Related:",
                "example:a:Examples:",
                "side:a:Valid on side:"
        ]
    }

    // Optional: versioning-Block nur nötig wenn du vom Default abweichen willst.
    // Das Plugin liest minecraft_version, mod_version und release_channel
    // automatisch aus gradle.properties – du musst hier nichts setzen.
    //
    // versioning {
    //     releaseVersionFormat = "{mc}-{mod}"
    //     versionFormat        = "{mc}-{channel}-{mod}"
    // }
}