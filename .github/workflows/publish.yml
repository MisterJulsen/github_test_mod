name: Publish to Mod Platforms

on:
  release:
    types: [published]

jobs:
  prepare:
    if: ${{ !contains(github.event.release.body, '[skip-mod-publish]') }}
    runs-on: ubuntu-latest

    outputs:
      loaders: ${{ steps.parse.outputs.loaders }}
      release_title: ${{ steps.parse.outputs.release_title }}
      mod_version: ${{ steps.parse.outputs.mod_version }}
      mc_version: ${{ steps.parse.outputs.mc_version }}
      release_channel: ${{ steps.parse.outputs.release_channel }}
      full_version: ${{ steps.parse.outputs.full_version }}
      maven_local_path: ${{ steps.parse.outputs.maven_local_path }}
      internal_artifact_name: ${{ steps.parse.outputs.internal_artifact_name }}
      ci_run_id: ${{ steps.parse.outputs.ci_run_id }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      # metadata.json comes from the internal Actions Artifact created by release.yml.
      # We find the correct run by searching for the most recent release.yml run
      # that produced an artifact named "internal-<tag>", then download it explicitly.
      - name: Find release.yml run ID for this tag
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          ARTIFACT_NAME="internal-${TAG}"

          # Search the last 20 release.yml runs for the matching artifact
          RUN_ID=$(gh api             "repos/${{ github.repository }}/actions/workflows/release.yml/runs?per_page=20&status=success"             --jq ".workflow_runs[] |
              select(.head_branch == "${{ github.event.release.target_commitish }}"
                     or .head_sha == "${{ github.event.release.target_commitish }}") |
              .id"             | head -n5             | while read -r rid; do
                EXISTS=$(gh api                   "repos/${{ github.repository }}/actions/runs/${rid}/artifacts"                   --jq ".artifacts[] | select(.name == "${ARTIFACT_NAME}") | .id" 2>/dev/null || true)
                if [ -n "$EXISTS" ]; then
                  echo "$rid"
                  break
                fi
              done)

          if [ -z "$RUN_ID" ]; then
            echo "Error: Could not find a release.yml run with artifact '${ARTIFACT_NAME}'" >&2
            exit 1
          fi

          echo "Found run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download internal artifact
        uses: actions/download-artifact@v4
        with:
          name: internal-${{ github.event.release.tag_name }}
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: internal/

      - name: Parse metadata and build loader matrix
        id: parse
        run: |
          META="internal/metadata.json"

          MOD_ID=$(jq -r '.mod_id' "$META")
          MOD_NAME=$(jq -r '.display_name' "$META")
          MC_VERSION=$(jq -r '.minecraft_version' "$META")
          MOD_VERSION=$(jq -r '.mod_version' "$META")
          FULL_VERSION=$(jq -r '.full_version' "$META")
          RELEASE_CHANNEL=$(jq -r '.release_channel' "$META")
          MAVEN_LOCAL_PATH=$(jq -r '.maven_local_path' "$META")

          PLATFORM_STRING=$(jq -r '
            if (.artifacts | length) > 0 then
              "[" + (.artifacts | keys | map(ascii_upcase) | join("/")) + "]"
            else "[]" end
          ' "$META")

          TITLE=$(jq -r '.mod_release_title_format' .mod-build-config.json)
          TITLE=${TITLE//\{MOD_ID\}/$MOD_ID}
          TITLE=${TITLE//\{MOD_NAME\}/$MOD_NAME}
          TITLE=${TITLE//\{MOD_VERSION\}/$MOD_VERSION}
          TITLE=${TITLE//\{FULL_VERSION\}/$FULL_VERSION}
          TITLE=${TITLE//\{MC_VERSION\}/$MC_VERSION}
          TITLE=${TITLE//\{RELEASE_CHANNEL\}/$RELEASE_CHANNEL}
          TITLE=${TITLE//\{PLATFORMS\}/$PLATFORM_STRING}

          CI_RUN_ID=$(jq -r '.ci_run_id' "$META")

          {
            echo "mod_id=$MOD_ID"
            echo "mod_name=$MOD_NAME"
            echo "mc_version=$MC_VERSION"
            echo "mod_version=$MOD_VERSION"
            echo "full_version=$FULL_VERSION"
            echo "release_channel=$RELEASE_CHANNEL"
            echo "maven_local_path=$MAVEN_LOCAL_PATH"
            echo "ci_run_id=$CI_RUN_ID"
            echo "release_title=$TITLE"
            echo "internal_artifact_name=internal-${FULL_VERSION}"
          } >> "$GITHUB_OUTPUT"

          LOADERS_JSON=$(jq -c '[.artifacts[].platform] | unique' "$META")
          echo "loaders=$LOADERS_JSON" >> "$GITHUB_OUTPUT"

          # Per-loader file lists – sources from the GitHub Release Assets
          # (the platform JARs that were attached to the draft)
          jq -r '.artifacts | to_entries[] | "\(.key) \(.value.filename)"' "$META" \
            | while read -r loader filename; do
                {
                  echo "release-assets/${filename}.jar"
                  find release-assets/ -maxdepth 1 \
                    \( -name "*${loader}*sources.jar" -o -name "*${loader}*javadoc.jar" \) \
                    2>/dev/null || true
                } > "files_${loader}.txt"
                echo "=== files_${loader}.txt ==="
                cat "files_${loader}.txt"
              done

      - name: Upload loader file lists
        uses: actions/upload-artifact@v4
        with:
          name: loader-data
          path: files_*.txt
          retention-days: 1

      - name: Release summary
        run: |
          echo "================================================"
          echo "               RELEASE SUMMARY"
          echo "================================================"
          echo "Mod:          ${{ steps.parse.outputs.mod_id }}"
          echo "Minecraft:    ${{ steps.parse.outputs.mc_version }}"
          echo "Version:      ${{ steps.parse.outputs.mod_version }}"
          echo "Full:         ${{ steps.parse.outputs.full_version }}"
          echo "Channel:      ${{ steps.parse.outputs.release_channel }}"
          echo "Loaders:      ${{ steps.parse.outputs.loaders }}"
          echo "================================================"

  # CurseForge & Modrinth – platform JARs from Release Assets, parallel per loader
  publish-platforms:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        loader: ${{ fromJson(needs.prepare.outputs.loaders) }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      # Download platform JARs from the GitHub Release Assets.
      # These are exactly the files that were in the Draft Release –
      # the ones you tested and approved.
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*.jar"
          out-file-path: release-assets

      - name: Download loader file lists
        uses: actions/download-artifact@v4
        with:
          name: loader-data

      - name: Load file list for ${{ matrix.loader }}
        id: files
        run: |
          FILE="files_${{ matrix.loader }}.txt"
          [ -f "$FILE" ] || { echo "Error: $FILE not found" >&2; exit 1; }
          {
            echo "list<<EOF"
            cat "$FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release title
        id: title
        run: |
          TITLE="${{ needs.prepare.outputs.release_title }}"
          TITLE=${TITLE//\{LOADER\}/${{ matrix.loader }}}
          echo "value=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.loader }} to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ steps.title.outputs.value }}
          version: ${{ needs.prepare.outputs.mod_version }}
          version-type: ${{ needs.prepare.outputs.release_channel }}
          game-versions: ${{ needs.prepare.outputs.mc_version }}
          loaders: ${{ matrix.loader }}
          changelog: ${{ github.event.release.body }}
          files: ${{ steps.files.outputs.list }}
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CF_ID }}
          curseforge-token: ${{ secrets.CF_TOKEN }}

  # Maven – slim JARs from the internal Actions Artifact → mod-resources → push
  # Gradle already wrote a complete Maven repo layout (POMs, all checksums,
  # maven-metadata.xml) during the release.yml build. We just push it.
  publish-maven:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      # Download the internal artifact that was created during release.yml.
      # It contains the complete Maven staging directory + metadata.json.
      # run-id points to the original release.yml run – required for cross-run download.
      - name: Download internal artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.internal_artifact_name }}
          run-id: ${{ needs.prepare.outputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: internal/

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MOD_RESOURCES_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" >> "$GITHUB_ENV"

      - name: Clone mod-resources
        run: git clone git@github.com:MisterJulsen/mod-resources.git /tmp/mod-resources

      # The internal artifact contains the Maven staging directory.
      # Its path inside the artifact mirrors the absolute localRepoDir path,
      # e.g. internal/home/runner/.m2/github/modsrepo/maven/
      # We sync only the maven/ subdirectory into mod-resources/maven/.
      - name: Sync Maven staging into mod-resources
        env:
          MAVEN_LOCAL_PATH: ${{ needs.prepare.outputs.maven_local_path }}
        run: |
          # Strip leading slash to get the relative path inside the artifact download
          RELATIVE_PATH="${MAVEN_LOCAL_PATH#/}"
          STAGING_DIR="internal/${RELATIVE_PATH}"

          if [ ! -d "$STAGING_DIR" ]; then
            echo "Error: Maven staging directory not found at: $STAGING_DIR" >&2
            echo "Contents of internal/:" >&2
            find internal/ -maxdepth 4 | head -40 >&2
            exit 1
          fi

          echo "Syncing from: $STAGING_DIR"
          rsync -av "$STAGING_DIR/" /tmp/mod-resources/maven/

      - name: Commit and push to mod-resources
        run: |
          cd /tmp/mod-resources
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add maven/
          if git diff --cached --quiet; then
            echo "Nothing to commit – version already published"
          else
            git commit -m "maven: ${{ needs.prepare.outputs.full_version }}"
            git push origin HEAD
          fi